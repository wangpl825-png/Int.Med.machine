<!DOCTYPE html>
<html lang="zh-Hant" class="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<meta name="description" content="內科住院醫師互動式練習系統：完整測驗、零碎時間練習、錯題重測，支援自訂 JSON 題庫與醫學影像判讀。" />
<title>內科練功坊 Internal Medicine Practice Machine</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) {
    tailwind.config = { darkMode: 'class' };
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   設計系統 Design tokens — 本區塊不依賴 Tailwind，確保離線／CDN 失效時
   應用程式的版面與可讀性仍然完整。
   ========================================================================= */
:root{
  --bg:#eef2f6;
  --bg-grad:radial-gradient(1200px 600px at 12% -8%, #d9f2ee 0%, transparent 55%),
            radial-gradient(1000px 500px at 105% 0%, #dbeafe 0%, transparent 50%);
  --surface:#ffffff;
  --surface-2:#f7fafc;
  --surface-3:#eef2f7;
  --border:#dde5ee;
  --border-strong:#c6d3e2;
  --text:#0f1d2e;
  --text-2:#3d5166;
  --muted:#6b7f95;
  --primary:#0d7f74;
  --primary-strong:#0b6a61;
  --primary-soft:#dbf5f0;
  --primary-ring:rgba(13,127,116,.30);
  --accent:#2563eb;
  --accent-soft:#e0ecff;
  --success:#158443;
  --success-soft:#dcf5e6;
  --danger:#c92a2a;
  --danger-soft:#fdE4e4;
  --warn:#b45309;
  --warn-soft:#fdf0d5;
  --violet:#7c3aed;
  --violet-soft:#efe6fe;
  --radius:16px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(15,29,46,.06), 0 1px 3px rgba(15,29,46,.05);
  --shadow:0 2px 6px rgba(15,29,46,.06), 0 14px 32px -18px rgba(15,29,46,.35);
  --shadow-lg:0 24px 60px -24px rgba(15,29,46,.45);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --header-h:56px;
  --tabbar-h:60px;
}
html.dark{
  --bg:#080e16;
  --bg-grad:radial-gradient(1200px 600px at 12% -8%, #0d2b2a 0%, transparent 55%),
            radial-gradient(1000px 500px at 105% 0%, #10203c 0%, transparent 50%);
  --surface:#101a26;
  --surface-2:#152232;
  --surface-3:#1b2b3d;
  --border:#243547;
  --border-strong:#33485f;
  --text:#e8eff7;
  --text-2:#b8c8d8;
  --muted:#8aa0b6;
  --primary:#2dd4bf;
  --primary-strong:#5eead4;
  --primary-soft:#0f3b39;
  --primary-ring:rgba(45,212,191,.28);
  --accent:#7cb0ff;
  --accent-soft:#16294a;
  --success:#4ade80;
  --success-soft:#0f3524;
  --danger:#f87171;
  --danger-soft:#3d1a1c;
  --warn:#fbbf24;
  --warn-soft:#3a2a10;
  --violet:#c4b5fd;
  --violet-soft:#2a2145;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.4), 0 18px 40px -24px rgba(0,0,0,.8);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.9);
}

*,*::before,*::after{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; padding:0;
  font-family:var(--font);
  background-color:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--text);
  font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0; line-height:1.35; font-weight:700; letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit; font-size:inherit; color:inherit}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
a{color:var(--primary); text-decoration:none}
:focus-visible{outline:3px solid var(--primary-ring); outline-offset:2px; border-radius:6px}
::selection{background:var(--primary-soft); color:var(--text)}

/* ---------- 版面骨架 ---------- */
.app-shell{min-height:100dvh; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:40;
  height:var(--header-h);
  display:flex; align-items:center; gap:.6rem;
  padding:0 .8rem;
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:.55rem; min-width:0; flex:1}
.brand-mark{
  width:32px;height:32px;flex:none;border-radius:10px;
  background:linear-gradient(140deg,var(--primary),#0ea5a3 60%,var(--accent));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:.85rem;
  box-shadow:0 4px 12px -4px var(--primary-ring);
}
.brand-text{min-width:0}
.brand-title{font-size:.98rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-sub{font-size:.66rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.04em}
.topbar-actions{display:flex; align-items:center; gap:.35rem; flex:none}

.icon-btn{
  width:36px;height:36px;flex:none;border:1px solid var(--border);
  background:var(--surface); border-radius:11px; cursor:pointer;
  display:grid;place-items:center; color:var(--text-2);
  transition:.16s ease;
}
.icon-btn:hover{background:var(--surface-3); color:var(--text); border-color:var(--border-strong)}
.icon-btn svg{width:18px;height:18px}

/* 主導覽（桌機在上、手機在下） */
.navtabs{
  position:sticky; top:var(--header-h); z-index:35;
  display:flex; gap:.25rem; padding:.4rem .6rem;
  background:color-mix(in srgb, var(--surface) 84%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  overflow-x:auto; scrollbar-width:none;
}
.navtabs::-webkit-scrollbar{display:none}
.navtab{
  border:0; background:transparent; cursor:pointer;
  padding:.42rem .8rem; border-radius:999px;
  font-size:.86rem; font-weight:600; color:var(--muted);
  white-space:nowrap; display:flex; align-items:center; gap:.35rem;
  transition:.16s ease;
}
.navtab:hover{color:var(--text); background:var(--surface-3)}
.navtab.active{background:var(--primary); color:#fff; box-shadow:0 4px 12px -4px var(--primary-ring)}
html.dark .navtab.active{color:#04211f}
.navtab .badge{
  background:var(--danger); color:#fff; font-size:.65rem; font-weight:800;
  min-width:18px; height:18px; padding:0 5px; border-radius:999px;
  display:grid; place-items:center; line-height:1;
}
.navtab.active .badge{background:rgba(255,255,255,.28)}

main{flex:1; width:100%}
.view{
  width:100%; max-width:1180px; margin:0 auto;
  padding:1rem .8rem 3rem;
  animation:fade .22s ease;
}
.view.wide{max-width:1500px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 元件 ---------- */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-sm);
}
.card-pad{padding:1rem}
.card-hd{
  display:flex; align-items:center; gap:.6rem; justify-content:space-between;
  padding:.85rem 1rem; border-bottom:1px solid var(--border);
}
.card-title{font-size:1rem; font-weight:800; display:flex; align-items:center; gap:.5rem}
.sec-title{font-size:.78rem; font-weight:800; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; margin:1.4rem 0 .6rem}
.sec-title:first-child{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.73rem}
.mono{font-family:var(--mono)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  padding:.6rem 1rem; border-radius:12px; font-weight:700; font-size:.9rem;
  cursor:pointer; transition:.16s ease; text-align:center;
  min-height:44px; /* 觸控目標 */
}
.btn:hover{background:var(--surface-3); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 6px 16px -8px var(--primary-ring)}
.btn-primary:hover{background:var(--primary-strong); border-color:var(--primary-strong)}
html.dark .btn-primary{color:#042a27}
.btn-accent{background:var(--accent); border-color:var(--accent); color:#fff}
html.dark .btn-accent{color:#07203f}
.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff}
html.dark .btn-danger{color:#2b0d0d}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-sm{padding:.38rem .7rem; font-size:.8rem; min-height:36px; border-radius:10px}
.btn-lg{padding:.85rem 1.3rem; font-size:1rem; min-height:52px; border-radius:14px}
.btn-block{width:100%}
.btn-row{display:flex; flex-wrap:wrap; gap:.5rem}

.chip{
  display:inline-flex; align-items:center; gap:.3rem;
  padding:.2rem .55rem; border-radius:999px;
  font-size:.72rem; font-weight:700; line-height:1.6;
  background:var(--surface-3); color:var(--text-2); border:1px solid var(--border);
  white-space:nowrap;
}
.chip-primary{background:var(--primary-soft); color:var(--primary-strong); border-color:transparent}
html.dark .chip-primary{color:var(--primary-strong)}
.chip-success{background:var(--success-soft); color:var(--success); border-color:transparent}
.chip-danger{background:var(--danger-soft); color:var(--danger); border-color:transparent}
.chip-warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.chip-accent{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.chip-violet{background:var(--violet-soft); color:var(--violet); border-color:transparent}

.field{display:block; margin-bottom:.9rem}
.label{display:block; font-size:.82rem; font-weight:700; color:var(--text-2); margin-bottom:.35rem}
.input, .select, .textarea{
  width:100%; padding:.6rem .75rem; border-radius:11px;
  border:1px solid var(--border-strong); background:var(--surface-2);
  transition:.16s ease; font-size:.92rem;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none; border-color:var(--primary); background:var(--surface);
  box-shadow:0 0 0 3px var(--primary-ring);
}
.textarea{min-height:170px; font-family:var(--mono); font-size:.8rem; line-height:1.6; resize:vertical}

.pill-group{display:flex; flex-wrap:wrap; gap:.4rem}
.pill{
  border:1px solid var(--border-strong); background:var(--surface-2);
  padding:.45rem .8rem; border-radius:999px; cursor:pointer;
  font-size:.85rem; font-weight:700; color:var(--text-2); transition:.16s ease;
  min-height:40px; display:inline-flex; align-items:center; gap:.3rem;
}
.pill:hover{border-color:var(--primary); color:var(--primary)}
.pill.on{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 4px 12px -6px var(--primary-ring)}
html.dark .pill.on{color:#042a27}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:.6rem}
.stat{
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:.7rem .8rem;
}
.stat-num{font-size:1.5rem; font-weight:900; line-height:1.15; letter-spacing:-.02em}
.stat-lbl{font-size:.72rem; color:var(--muted); font-weight:600}

.bar{display:block; height:8px; border-radius:999px; background:var(--surface-3); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--primary); transition:width .5s cubic-bezier(.2,.7,.3,1)}

.empty{
  text-align:center; padding:2.2rem 1rem; color:var(--muted);
  border:1.5px dashed var(--border-strong); border-radius:var(--radius); background:var(--surface-2);
}
.empty .big{font-size:2rem; margin-bottom:.4rem}

.divider{height:1px; background:var(--border); margin:1rem 0; border:0}

/* ---------- 首頁模式卡 ---------- */
.mode-grid{display:grid; gap:.8rem; grid-template-columns:1fr}
.mode-card{
  position:relative; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:1.05rem; cursor:pointer;
  box-shadow:var(--shadow-sm); transition:.18s ease; overflow:hidden;
}
.mode-card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--primary)}
.mode-card::after{
  content:""; position:absolute; inset:0 auto 0 0; width:4px;
  background:var(--accent-c, var(--primary));
}
.mode-ico{
  width:42px;height:42px;border-radius:13px; display:grid;place-items:center;
  background:var(--accent-soft-c, var(--primary-soft)); color:var(--accent-c, var(--primary));
  font-size:1.25rem; margin-bottom:.6rem;
}
.mode-name{font-size:1.05rem; font-weight:800; margin-bottom:.2rem}
.mode-desc{font-size:.85rem; color:var(--muted); line-height:1.6}

/* ---------- 測驗版面（Galaxy Z Fold 7 雙欄 / 單欄自適應） ---------- */
.quiz-wrap{display:block}
.qnav-panel{display:none}
.quiz-main{min-width:0}

.qnav-inner{padding:.85rem}
.qnav-grid{
  display:grid; gap:.34rem;
  grid-template-columns:repeat(auto-fill,minmax(40px,1fr));
}
.qnav-btn{
  aspect-ratio:1/1; min-height:40px; border-radius:10px; cursor:pointer;
  border:1.5px solid var(--border-strong); background:var(--surface-2);
  font-size:.8rem; font-weight:800; color:var(--text-2);
  display:grid; place-items:center; position:relative; transition:.12s ease;
}
.qnav-btn:hover{border-color:var(--primary); color:var(--primary)}
.qnav-btn.answered{background:var(--primary-soft); border-color:var(--primary); color:var(--primary-strong)}
.qnav-btn.current{outline:3px solid var(--primary-ring); outline-offset:1px; border-color:var(--primary)}
.qnav-btn.correct{background:var(--success-soft); border-color:var(--success); color:var(--success)}
.qnav-btn.wrong{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.qnav-btn.flagged::after{
  content:""; position:absolute; top:2px; right:2px;
  width:7px;height:7px;border-radius:50%; background:var(--warn);
}
.legend{display:flex; flex-wrap:wrap; gap:.5rem .8rem; font-size:.72rem; color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block; margin-right:.25rem; vertical-align:-1px}

/* 題目工作區 */
.q-head{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.7rem}
.q-index{font-size:.95rem; font-weight:900; color:var(--primary)}
.q-stem{
  font-size:1.02rem; line-height:1.85; color:var(--text);
  white-space:pre-wrap; word-break:break-word;
}
.q-img-box{
  margin:.9rem 0; border-radius:12px; overflow:hidden;
  border:1px solid var(--border); background:var(--surface-2);
  position:relative;
}
.q-img{
  display:block; width:100%; height:auto; max-height:52vh;
  object-fit:contain; cursor:zoom-in; background:#fff;
}
html.dark .q-img{background:#0b1017}
.q-img-cap{
  font-size:.74rem; color:var(--muted); padding:.4rem .6rem;
  border-top:1px solid var(--border); display:flex; align-items:center; gap:.4rem; justify-content:space-between;
}
.zoom-hint{
  position:absolute; top:.5rem; right:.5rem; pointer-events:none;
  background:rgba(15,29,46,.72); color:#fff; font-size:.68rem; font-weight:700;
  padding:.2rem .5rem; border-radius:999px; display:flex; align-items:center; gap:.25rem;
}

.opts{display:flex; flex-direction:column; gap:.5rem; margin-top:1rem}
.opt{
  display:flex; align-items:flex-start; gap:.65rem; width:100%; text-align:left;
  padding:.75rem .85rem; border-radius:12px; cursor:pointer;
  border:1.5px solid var(--border-strong); background:var(--surface-2);
  transition:.14s ease; font-size:.94rem; line-height:1.7;
}
.opt:hover{border-color:var(--primary); background:var(--surface); transform:translateX(2px)}
.opt-key{
  flex:none; width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center; font-weight:900; font-size:.82rem;
  background:var(--surface-3); color:var(--text-2); border:1px solid var(--border);
  margin-top:1px;
}
.opt-text{min-width:0; word-break:break-word; flex:1}
.opt.sel{border-color:var(--primary); background:var(--primary-soft); box-shadow:0 0 0 3px var(--primary-ring)}
.opt.sel .opt-key{background:var(--primary); color:#fff; border-color:var(--primary)}
html.dark .opt.sel .opt-key{color:#042a27}
.opt.ok{border-color:var(--success); background:var(--success-soft)}
.opt.ok .opt-key{background:var(--success); color:#fff; border-color:var(--success)}
.opt.bad{border-color:var(--danger); background:var(--danger-soft)}
.opt.bad .opt-key{background:var(--danger); color:#fff; border-color:var(--danger)}
.opt.locked{cursor:default}
.opt.locked:hover{transform:none}
.opt-tag{
  margin-left:auto; flex:none; font-size:.68rem; font-weight:800;
  padding:.12rem .45rem; border-radius:999px; align-self:center;
}
.opt-tag.ok{background:var(--success); color:#fff}
.opt-tag.bad{background:var(--danger); color:#fff}
.opt-tag.you{background:var(--text-2); color:var(--surface)}

/* 底部操作列（手機） */
.quiz-footer{
  position:sticky; bottom:0; z-index:30; margin-top:1rem;
  display:flex; align-items:center; gap:.5rem;
  padding:.55rem .6rem calc(.55rem + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  border-radius:14px 14px 0 0;
  box-shadow:0 -6px 20px -12px rgba(15,29,46,.4);
}
.quiz-footer .btn{flex:1}
.progress-strip{height:4px; background:var(--surface-3); border-radius:999px; overflow:hidden; margin-bottom:.7rem}
.progress-strip > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent)); transition:width .35s ease}

/* ---------- 詳解卡 ---------- */
.review-card{margin-bottom:.8rem; overflow:hidden}
.review-hd{
  display:flex; align-items:center; gap:.55rem; flex-wrap:wrap;
  padding:.7rem .9rem; border-bottom:1px solid var(--border);
  font-size:.85rem; font-weight:700;
}
.review-hd.ok{background:var(--success-soft); color:var(--success)}
.review-hd.bad{background:var(--danger-soft); color:var(--danger)}
.review-hd.skip{background:var(--warn-soft); color:var(--warn)}
.review-body{padding:.9rem}

.acc-btn{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  padding:.7rem .85rem; border-radius:12px; cursor:pointer;
  border:1px solid var(--border-strong); background:var(--surface-2);
  font-weight:800; font-size:.88rem; margin-top:.9rem; transition:.14s ease;
  min-height:46px;
}
.acc-btn:hover{background:var(--surface-3); border-color:var(--primary)}
.acc-btn[aria-expanded="true"]{background:var(--primary-soft); border-color:var(--primary); color:var(--primary-strong)}
.acc-btn .caret{transition:transform .2s ease; flex:none}
.acc-btn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.acc-panel{display:none; padding-top:.7rem; animation:fade .2s ease}
.acc-panel.open{display:block}

.expl-block{
  border-left:4px solid var(--primary); background:var(--primary-soft);
  border-radius:0 12px 12px 0; padding:.75rem .9rem; margin-bottom:.8rem;
}
.expl-block .h{
  font-size:.76rem; font-weight:900; letter-spacing:.06em;
  color:var(--primary-strong); margin-bottom:.3rem; display:flex; align-items:center; gap:.35rem;
}
.expl-block .b{font-size:.9rem; line-height:1.85; color:var(--text); white-space:pre-wrap}

.brk{display:flex; flex-direction:column; gap:.5rem}
.brk-item{
  display:flex; gap:.6rem; padding:.65rem .75rem; border-radius:11px;
  background:var(--surface-2); border:1px solid var(--border);
}
.brk-item.is-ans{background:var(--success-soft); border-color:color-mix(in srgb,var(--success) 35%, transparent)}
.brk-item.is-you{background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 35%, transparent)}
.brk-key{
  flex:none; width:26px;height:26px;border-radius:8px; display:grid;place-items:center;
  font-weight:900; font-size:.78rem; background:var(--surface-3); color:var(--text-2);
}
.brk-item.is-ans .brk-key{background:var(--success); color:#fff}

const _imgCache = {};
function resolveImage(url) {
  if (!url) return "";
  const s = String(url).trim();
  if (s.startsWith("builtin:")) {

    if (!BUILTIN_IMAGES[key]) return "";

/* ------------------------- 2. 題庫正規化 -------------------------
   盡量寬鬆地接受各種 JSON 寫法，讓匯入題目時不易出錯。
--------------------------------------------------------------------------- */
function normalizeQuestion(raw, idx) {
  const err = (msg) => ({ ok: false, error: msg, raw });
  if (!raw || typeof raw !== "object") return err("題目不是物件");

  const stem = String(raw.stem ?? raw.question ?? raw.題目 ?? "").trim();
  if (!stem) return err("缺少題幹 stem");

  /* --- 選項：支援陣列 ["A. xxx"] / ["xxx"] 或物件 {A:"xxx"} --- */
  let options = [];
  const src = raw.options ?? raw.choices ?? raw.選項;
  if (Array.isArray(src)) {
    src.forEach((o, i) => {
      const text = typeof o === "string" ? o : String(o?.text ?? o?.label ?? "");
      const m = text.match(/^\s*\(?([A-Ea-e])\)?\s*[.、．:：)]\s*(.+)$/s);
      if (m) options.push({ key: m[1].toUpperCase(), text: m[2].trim() });
      else options.push({ key: (typeof o === "object" && o?.key) ? String(o.key).toUpperCase() : LETTERS[i], text: text.trim() });
    });
  } else if (src && typeof src === "object") {
    Object.keys(src).sort().forEach((k) => options.push({ key: String(k).toUpperCase(), text: String(src[k]).trim() }));
  }
  options = options.filter((o) => o.text);
  if (options.length < 2) return err("選項不足 2 個");
  /* 若字母重複或缺漏，重新編號以保證唯一 */
  const seen = new Set();
  options.forEach((o, i) => {
    if (!o.key || seen.has(o.key)) o.key = LETTERS[i];
    seen.add(o.key);
  });

  /* --- 正解：支援 "A" / "a" / "A." / ["A","C"] / 索引數字 / 完整選項文字 --- */
  const keys = options.map((o) => o.key);
  const toKey = (v) => {
    if (v == null) return null;
    if (typeof v === "number") {
      if (v >= 0 && v < keys.length && Number.isInteger(v)) return keys[v];      // 0-based
      if (v >= 1 && v <= keys.length) return keys[v - 1];                        // 1-based
      return null;
    }
    const s = String(v).trim();
    const m = s.match(/^\(?([A-Ea-e])\)?[.、．:：)]?$/);
    if (m) { const k = m[1].toUpperCase(); return keys.includes(k) ? k : null; }
    const byText = options.find((o) => o.text === s || `${o.key}. ${o.text}` === s);
    if (byText) return byText.key;
    if (/^\d+$/.test(s)) return toKey(parseInt(s, 10));
    return null;
  };
  const rawAns = raw.answer ?? raw.correct ?? raw.correct_answer ?? raw.答案;
  let answers = (Array.isArray(rawAns) ? rawAns : String(rawAns ?? "").split(/[,\s、/]+/))
    .map(toKey).filter(Boolean);
  answers = Array.from(new Set(answers));
  if (!answers.length) {
    /* 允許 "AC" 這種連寫多選 */
    const compact = String(rawAns ?? "").toUpperCase().replace(/[^A-E]/g, "").split("");
    answers = Array.from(new Set(compact.filter((c) => keys.includes(c))));
  }
  if (!answers.length) return err("找不到有效的正解 answer");

  /* --- 逐項解析：物件 {A:"..."} 或與選項等長的陣列 --- */
  let breakdown = {};
  const bd = raw.option_breakdown ?? raw.options_explanation ?? raw.選項解析;
  if (Array.isArray(bd)) bd.forEach((t, i) => { if (keys[i]) breakdown[keys[i]] = String(t ?? ""); });
  else if (bd && typeof bd === "object") Object.keys(bd).forEach((k) => { breakdown[String(k).toUpperCase()] = String(bd[k] ?? ""); });

  let fixes = {};
  const fx = raw.option_fix ?? raw.修正;
  if (fx && typeof fx === "object" && !Array.isArray(fx)) Object.keys(fx).forEach((k) => { fixes[String(k).toUpperCase()] = String(fx[k] ?? ""); });

  /* --- 圖片：支援單一字串、陣列，並自動還原 Markdown 連結寫法 [url](url) --- */
  const unwrapMd = (u) => {
    const s = String(u).trim();
    const m = s.match(/^\[(.+?)\]\((.+?)\)$/);
    return (m ? m[2] : s).trim();
  };
  const images = []
    .concat(raw.image_url ?? raw.image ?? raw.圖片 ?? [])
    .concat(raw.images ?? [])
    .flat()
    .map(unwrapMd)
    .filter(Boolean);

  return {
    ok: true,
    q: {
      id: String(raw.id ?? raw.qid ?? `Q${String(idx + 1).padStart(3, "0")}`),
      uid: uid(),
      category: String(raw.category ?? raw.subject ?? raw.科別 ?? "未分類 (Uncategorized)").trim(),
      difficulty: raw.difficulty ? String(raw.difficulty) : "",
      source: raw.source ? String(raw.source) : "",
      tags: Array.isArray(raw.tags) ? raw.tags.map(String) : [],
      stem,
      images: images.filter(Boolean),
      imageCaption: String(raw.image_caption ?? raw.圖片說明 ?? "").trim(),
      options,
      answers,
      multi: answers.length > 1,
      core: String(raw.core_explanation ?? raw.explanation ?? raw.核心解析 ?? "").trim(),
      breakdown,
      fixes,
      reference: String(raw.reference ?? raw.references ?? "").trim(),
    },
  };
}

/** 解析上傳 / 貼上的 JSON 內容 → {questions, errors} */
function parseBankJSON(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error("JSON 格式錯誤：" + e.message); }
  let arr = data;
  if (!Array.isArray(arr)) {
    arr = data?.questions ?? data?.items ?? data?.data ?? data?.題目;
  }
  if (!Array.isArray(arr)) throw new Error("找不到題目陣列。請提供 JSON 陣列，或含有 questions / items / data 欄位的物件。");
  const questions = [], errors = [];
  arr.forEach((raw, i) => {
    const r = normalizeQuestion(raw, i);
    if (r.ok) questions.push(r.q);
    else errors.push(`第 ${i + 1} 題：${r.error}`);
  });
  return { questions, errors };
}

const CAT_CLASSES = ["chip-primary", "chip-accent", "chip-violet", "chip-warn", "chip-success", "chip-danger"];
function catClass(cat) {
  let h = 0;

}

    openModal(`<h3>${esc(title)}</h3>
      <p class="small muted" style="margin:.4rem 0 1rem">${body}</p>
      <div class="btn-row" style="justify-content:flex-end">

/* ------------------------- 11. 測驗引擎 ------------------------- */
let timerHandle = null;

function startQuiz({ mode, navKey, title, questions, shuffleQ = false, limitMin = 0 }) {
  if (!questions.length) { toast("沒有符合條件的題目", "err"); return; }
  let qs = shuffleQ ? shuffle(questions) : questions.slice();
  if (state.settings.shuffleOptions) {
    qs = qs.map((q) => Object.assign({}, q, { options: shuffle(q.options) }));
  }
  state.quiz = {
    mode, navKey, title,
    qs,
    answers: {},
    flags: {},
    idx: 0,
    startedAt: Date.now(),
    limitMs: limitMin * 60000,
    submitted: false,
  };
  state.result = null;
  LS.del(K.resume);
  go("quiz");
}

function persistResume() {
  const z = state.quiz;
  if (!z || z.submitted) return;
  LS.set(K.resume, {
    title: z.title, mode: z.mode, navKey: z.navKey,
    ids: z.qs.map((q) => q.id),
    qs: z.qs, answers: z.answers, flags: z.flags, idx: z.idx,
    startedAt: z.startedAt, limitMs: z.limitMs,
    total: z.qs.length,
    answered: Object.keys(z.answers).length,
    remain: z.qs.length - Object.keys(z.answers).length,
    savedAt: Date.now(),
  });
}

function resumeQuiz() {
  const r = LS.get(K.resume, null);
  if (!r) { toast("找不到未完成的測驗", "err"); return; }
  state.quiz = {
    mode: r.mode, navKey: r.navKey, title: r.title, qs: r.qs,
    answers: r.answers || {}, flags: r.flags || {}, idx: r.idx || 0,
    startedAt: Date.now() - (r.savedAt - r.startedAt), limitMs: r.limitMs || 0, submitted: false,
  };
  go("quiz");
}

const isCorrect = (q, chosen) => {
  if (!chosen || !chosen.length) return false;
  const a = q.answers.slice().sort().join(",");
  return chosen.slice().sort().join(",") === a;
};

function pickOption(key) {
  const z = state.quiz;
  if (!z || z.submitted) return;
  const q = z.qs[z.idx];
  const cur = z.answers[z.idx] || [];
  if (q.multi) {
    z.answers[z.idx] = cur.includes(key) ? cur.filter((k) => k !== key) : cur.concat(key);
    if (!z.answers[z.idx].length) delete z.answers[z.idx];
    renderQuizBody();
  } else {
    z.answers[z.idx] = [key];
    renderQuizBody();
    /* 單選：自動前進到下一題（最後一題則停留） */
    if (z.idx < z.qs.length - 1) setTimeout(() => { z.idx++; renderQuizBody(); }, 220);
  }
  persistResume();
}

function gotoQ(i) {
  const z = state.quiz;
  if (!z) return;
  z.idx = clamp(i, 0, z.qs.length - 1);
  renderQuizBody();
  closeSheet();
  const el = $("#quizTop");
  if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function submitQuiz(auto = false) {
  const z = state.quiz;
  if (!z || z.submitted) return;
  z.submitted = true;
  z.endedAt = Date.now();
  stopTimer();
  LS.del(K.resume);

  const byCat = {};
  let correct = 0, wrong = 0, blank = 0;
  z.qs.forEach((q, i) => {
    const chosen = z.answers[i] || [];
    const ok = isCorrect(q, chosen);
    byCat[q.category] = byCat[q.category] || { c: 0, t: 0 };
    byCat[q.category].t++;
    if (!chosen.length) blank++;
    else if (ok) { correct++; byCat[q.category].c++; }
    else wrong++;
    recordAnswer(q, chosen, ok);
  });
  saveWrong();

  const total = z.qs.length;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const durationMs = z.endedAt - z.startedAt;

  const rec = {
    id: uid(), mode: z.mode, title: z.title, ts: z.endedAt,
    total, correct, wrong, blank, pct, durationMs, byCat,
  };
  state.history.unshift(rec);
  saveHistory();

  state.result = {
    title: z.title, mode: z.mode, navKey: z.navKey,
    qs: z.qs, answers: z.answers, flags: z.flags,
    total, correct, wrong, blank, pct, durationMs, byCat, ts: z.endedAt, auto,
  };
  state.reviewFilter = "all";
  go("result");
}

/** 錯題本維護：答錯收錄；答對且已在錯題本 → 連對達標後移除 */
function recordAnswer(q, chosen, ok) {
  const idx = state.wrong.findIndex((w) => w.qid === q.id && w.q.stem === q.stem);
  if (!ok) {
    /* 答錯或未作答皆收錄（未作答代表尚未掌握） */
    if (idx >= 0) {
      state.wrong[idx].wrongCount++;
      state.wrong[idx].streak = 0;
      state.wrong[idx].lastWrongAt = Date.now();
      state.wrong[idx].lastChosen = chosen;
    } else {
      state.wrong.unshift({
        qid: q.id, q: Object.assign({}, q, { options: q.options.slice() }),
        wrongCount: 1, streak: 0, lastWrongAt: Date.now(), lastChosen: chosen,
      });
    }
  } else if (idx >= 0) {
    state.wrong[idx].streak = (state.wrong[idx].streak || 0) + 1;
    if (state.wrong[idx].streak >= state.settings.masteryStreak) state.wrong.splice(idx, 1);
  }
}

/* 計時器 */
function startTimer() {
  stopTimer();
  timerHandle = setInterval(() => {
    const z = state.quiz;
    if (!z || z.submitted) return stopTimer();
    const el = $("#timerVal");
    const elapsed = Date.now() - z.startedAt;
    if (z.limitMs) {
      const left = z.limitMs - elapsed;
      if (el) {
        el.textContent = fmtTime(Math.max(0, left));
        el.style.color = left < 300000 ? "var(--danger)" : "";
      }
      if (left <= 0) { toast("時間到，系統自動交卷", "err"); submitQuiz(true); }
    } else if (el) el.textContent = fmtTime(elapsed);
  }, 1000);
}
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  const body = $("#quizBody");

  if (panel) {

    tmp.innerHTML = qnavHTML();

    const sheetBtn = footer.querySelector('[data-act="opensheet"]');

    const flagBtn = footer.querySelector('[data-act="flag"]');

      nextWrap.className = "btn btn-primary";

}

/* ------------------------- 13. 詳解卡與結果頁 ------------------------- */
function splitFix(text) {
  const s = String(text || "").trim();
  const m = s.match(/^([\s\S]*?)(?:修正|改寫|修正方向)\s*[:：]\s*([\s\S]+)$/);
  if (m) return { reason: m[1].trim().replace(/[，,、]\s*$/, ""), fix: m[2].trim() };
  return { reason: s, fix: "" };
}

function reviewCard(q, i, chosen, opts = {}) {
  const ok = isCorrect(q, chosen);
  const blank = !chosen.length;
  const cls = blank ? "skip" : ok ? "ok" : "bad";
  const label = blank ? "⊘ 未作答" : ok ? "✓ 答對" : "✗ 答錯";
  const accId = `acc-r-${i}`;
  const open = opts.open ? "open" : "";

  const optHTML = q.options.map((o) => {
    const isAns = q.answers.includes(o.key);
    const isYou = chosen.includes(o.key);
    const c = isAns ? "ok" : isYou ? "bad" : "";
    return `<div class="opt locked ${c}">
      <span class="opt-key">${esc(o.key)}</span>
      <span class="opt-text">${esc(o.text)}</span>
      ${isAns ? `<span class="opt-tag ok">正解</span>` : isYou ? `<span class="opt-tag bad">你的選擇</span>` : ""}
    </div>`;
  }).join("");

  const brkHTML = q.options.map((o) => {
    const isAns = q.answers.includes(o.key);
    const isYou = chosen.includes(o.key) && !isAns;
    const raw = q.breakdown[o.key] || "";
    const { reason, fix } = splitFix(raw);
    const extraFix = q.fixes[o.key] || "";
    const finalFix = fix || extraFix;
    const body = reason || (isAns ? "（本題未提供正解說明）" : "（本題未提供此選項的解析）");
    return `<div class="brk-item ${isAns ? "is-ans" : isYou ? "is-you" : ""}">
      <span class="brk-key">${esc(o.key)}</span>
      <div class="brk-body">
        <div class="brk-opt">${esc(o.text)} ${isAns ? '<span class="chip chip-success" style="margin-left:.3rem">正解</span>' : ""}${isYou ? '<span class="chip chip-danger" style="margin-left:.3rem">你的選擇</span>' : ""}</div>
        <div class="brk-txt">${esc(body)}</div>
        ${finalFix ? `<div class="brk-fix"><b>✎ 如何修正才會正確：</b>${esc(finalFix)}</div>`
          : (!isAns && !raw ? `<div class="brk-fix">✎ 此選項尚未提供「如何改寫才正確」的說明，可於 JSON 的 <code>option_breakdown</code> 內以「修正：⋯」補充。</div>` : "")}
      </div>
    </div>`;
  }).join("");

  return `<div class="card review-card" data-status="${blank ? "blank" : ok ? "ok" : "bad"}">
    <div class="review-hd ${cls}">
      <span>${label}</span>
      <span class="chip">第 ${i + 1} 題</span>
      <span class="chip ${catClass(q.category)}">${esc(q.category)}</span>
      ${q.difficulty ? `<span class="chip">難度 ${esc(q.difficulty)}</span>` : ""}
      <span class="tiny mono" style="margin-left:auto; opacity:.8">${esc(q.id)}</span>
    </div>
    <div class="review-body">
      <div class="q-stem" style="font-size:.97rem">${esc(q.stem)}</div>
      ${imagesHTML(q)}
      <div class="opts">${optHTML}</div>
      <div class="small" style="margin-top:.7rem; color:var(--muted)">
        正解：<b style="color:var(--success)">${q.answers.join("、")}</b>
        ${blank ? " · 你未作答" : ` · 你的選擇：<b style="color:${ok ? "var(--success)" : "var(--danger)"}">${chosen.join("、")}</b>`}
      </div>

      <button class="acc-btn" data-acc="r-${i}" aria-expanded="${open ? "true" : "false"}">
        <span>📖 ${open ? "收合" : "展開"}完整詳解（核心解析 + 選項逐項解析與修正）</span>
        <span class="caret">▾</span>
      </button>
      <div class="acc-panel ${open}" id="${accId}">
        ${q.core ? `<div class="expl-block">
          <div class="h">🩺 核心解析 CORE CONCEPT / PEARL</div>
          <div class="b">${esc(q.core)}</div>
        </div>` : `<div class="expl-block"><div class="h">🩺 核心解析</div><div class="b">（本題未提供核心解析，可於 JSON 的 core_explanation 補充。）</div></div>`}
        <div class="sec-title" style="margin:.9rem 0 .5rem">選項逐項解析與修正</div>
        <div class="brk">${brkHTML}</div>
        ${q.tags.length || q.source || q.reference ? `<div style="margin-top:.8rem; display:flex; flex-wrap:wrap; gap:.35rem; align-items:center">
          ${q.tags.map((t) => `<span class="chip">#${esc(t)}</span>`).join("")}
          ${q.source ? `<span class="chip">出處：${esc(q.source)}</span>` : ""}
          ${q.reference ? `<span class="chip">參考：${esc(q.reference)}</span>` : ""}
        </div>` : ""}
      </div>
    </div>
  </div>`;
}

function viewResult() {
  const r = state.result;
  if (!r) return viewHome();
  const color = r.pct >= 80 ? "var(--success)" : r.pct >= 60 ? "var(--warn)" : "var(--danger)";

    if (f === "wrong" && status === "ok") return "";

  }).join("");

  return `<div class="view">

          <div class="stat"><div class="stat-num" style="color:var(--warn)">${r.blank}</div><div class="stat-lbl">未作答</div></div>

        <button class="btn btn-sm" data-act="collapse-all">全部收合</button>

    <div id="reviewList">${cards || `<div class="empty">此分類沒有題目 🎉</div>`}</div>

/* ------------------------- 14. 影像燈箱（支援雙指縮放 / 拖曳 / 滾輪 / 雙擊） ------------------------- */
const LB = {
  el: null, stage: null, img: null,
  scale: 1, tx: 0, ty: 0,
  pointers: new Map(), lastDist: 0, lastMid: null,
  panFrom: null, lastTap: 0,
  moved: false, downAt: null,
  MIN: 1, MAX: 8,
};

function lbApply() {
  LB.img.style.transform = `translate(${LB.tx}px, ${LB.ty}px) scale(${LB.scale})`;
  const z = $("#lbZoom");
  if (z) z.textContent = Math.round(LB.scale * 100) + "%";
  LB.stage.style.cursor = LB.scale > 1 ? "grab" : "zoom-in";
}
function lbReset() { LB.scale = 1; LB.tx = 0; LB.ty = 0; lbApply(); }

/** 以畫面上的某一點為中心縮放 */
function lbZoomAt(newScale, clientX, clientY) {
  const rect = LB.stage.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const px = (clientX ?? cx) - cx;
  const py = (clientY ?? cy) - cy;
  const s = clamp(newScale, LB.MIN, LB.MAX);
  LB.tx = px - ((px - LB.tx) * s) / LB.scale;
  LB.ty = py - ((py - LB.ty) * s) / LB.scale;
  LB.scale = s;
  if (LB.scale <= 1.001) { LB.tx = 0; LB.ty = 0; LB.scale = 1; }
  lbApply();
}

/** 開啟後自動選擇合適的起始倍率：
    寬幅影像（如 EKG 長條）在窄螢幕上「符合寬度」後會過小，
    因此自動放大到約佔畫面高度 60%，讓細微波形一開始就看得清楚。 */
function lbAutoFit() {
  const r = LB.stage.getBoundingClientRect();
  const h = LB.img.getBoundingClientRect().height;
  if (!h || !r.height) return;
  const w = LB.img.getBoundingClientRect().width;
  if (h < r.height * 0.42) {
    /* 以高度為目標放大，但限制放大後寬度不超過畫面的 2 倍，避免一開始就要大量平移 */
    const byHeight = (r.height * 0.62) / h;
    const byWidth = w ? (r.width * 2.0) / w : byHeight;
    LB.scale = clamp(Math.min(byHeight, byWidth), 1, 3);
    LB.tx = 0; LB.ty = 0;
    lbApply();
  }
}

function openLightbox(src, cap) {
  LB.el = $("#lightbox"); LB.stage = $("#lbStage"); LB.img = $("#lbImg");
  $("#lbCap").textContent = cap || "";
  $("#lbTitle").textContent = cap ? cap.slice(0, 60) : "醫學影像檢視";
  LB.el.classList.add("open");
  document.body.style.overflow = "hidden";
  const start = () => { lbReset(); lbAutoFit(); };
  if (LB.img.src === src && LB.img.complete) start();
  else { LB.img.onload = start; LB.img.src = src; lbReset(); }
}
function closeLightbox() {
  if (!LB.el) return;
  LB.el.classList.remove("open");
  document.body.style.overflow = "";
  LB.pointers.clear();
}

function initLightbox() {
  LB.el = $("#lightbox"); LB.stage = $("#lbStage"); LB.img = $("#lbImg");

  $("#lbClose").addEventListener("click", closeLightbox);
  $("#lbIn").addEventListener("click", () => lbZoomAt(LB.scale * 1.5));
  $("#lbOut").addEventListener("click", () => lbZoomAt(LB.scale / 1.5));
  $("#lbReset").addEventListener("click", lbReset);
  /* 點背景關閉；但剛結束拖曳／縮放手勢時不要誤關 */
  LB.el.addEventListener("click", (e) => {
    if (e.target !== LB.el && e.target !== LB.stage) return;
    if (LB.moved) { LB.moved = false; return; }
    closeLightbox();
  });

  LB.stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    lbZoomAt(LB.scale * (e.deltaY < 0 ? 1.16 : 1 / 1.16), e.clientX, e.clientY);
  }, { passive: false });

  LB.stage.addEventListener("pointerdown", (e) => {
    LB.stage.setPointerCapture(e.pointerId);
    LB.moved = false;
    LB.downAt = { x: e.clientX, y: e.clientY };
    LB.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (LB.pointers.size === 1) {
      LB.panFrom = { x: e.clientX, y: e.clientY, tx: LB.tx, ty: LB.ty };
      /* 雙擊 / 雙點 → 在 1x 與 2.6x 之間切換 */
      const now = Date.now();
      if (now - LB.lastTap < 300) {
        lbZoomAt(LB.scale > 1.2 ? 1 : 2.6, e.clientX, e.clientY);
        LB.lastTap = 0;
      } else LB.lastTap = now;
    } else if (LB.pointers.size === 2) {
      const [a, b] = Array.from(LB.pointers.values());
      LB.lastDist = Math.hypot(a.x - b.x, a.y - b.y);
      LB.lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      LB.panFrom = null;
    }
    LB.stage.classList.add("dragging");
  });

  LB.stage.addEventListener("pointermove", (e) => {
    if (!LB.pointers.has(e.pointerId)) return;
    if (LB.downAt && Math.hypot(e.clientX - LB.downAt.x, e.clientY - LB.downAt.y) > 6) LB.moved = true;
    LB.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (LB.pointers.size === 2) {
      const [a, b] = Array.from(LB.pointers.values());
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (LB.lastDist > 0) {
        const ratio = dist / LB.lastDist;
        /* 縮放 + 隨雙指中心平移 */
        LB.tx += mid.x - LB.lastMid.x;
        LB.ty += mid.y - LB.lastMid.y;
        lbZoomAt(LB.scale * ratio, mid.x, mid.y);
      }
      LB.lastDist = dist; LB.lastMid = mid;
    } else if (LB.pointers.size === 1 && LB.panFrom && LB.scale > 1) {
      LB.tx = LB.panFrom.tx + (e.clientX - LB.panFrom.x);
      LB.ty = LB.panFrom.ty + (e.clientY - LB.panFrom.y);
      lbApply();
    }
  });

  const up = (e) => {
    LB.pointers.delete(e.pointerId);
    if (LB.pointers.size < 2) { LB.lastDist = 0; LB.lastMid = null; }
    if (LB.pointers.size === 0) { LB.panFrom = null; LB.stage.classList.remove("dragging"); }
  };
  LB.stage.addEventListener("pointerup", up);
  LB.stage.addEventListener("pointercancel", up);
  LB.stage.addEventListener("pointerleave", up);
}

/* ------------------------- 15. 匯入 / 匯出 ------------------------- */
function toRawSchema(q) {
  const o = {
    id: q.id,
    category: q.category,
    stem: q.stem,
    options: q.options.map((x) => `${x.key}. ${x.text}`),
    answer: q.multi ? q.answers : q.answers[0],
    core_explanation: q.core,
    option_breakdown: q.breakdown,
  };
  if (q.images.length) o.image_url = q.images.length === 1 ? q.images[0] : q.images;
  if (q.imageCaption) o.image_caption = q.imageCaption;
  if (q.difficulty) o.difficulty = q.difficulty;
  if (q.tags.length) o.tags = q.tags;
  if (q.source) o.source = q.source;
  if (q.reference) o.reference = q.reference;
  if (Object.keys(q.fixes).length) o.option_fix = q.fixes;
  return o;
}

function downloadJSON(filename, obj) {
  try {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("已開始下載：" + filename, "ok");
  } catch (e) { toast("下載失敗：" + e.message, "err"); }
}

let importMode = "append";

function addQuestions(newQs, sourceName, mode) {
  if (!newQs.length) { toast("沒有可匯入的題目", "err"); return 0; }
  if (mode === "replace") {
    state.bank = newQs;
    state.meta = { name: sourceName, loadedAt: Date.now(), sources: [sourceName] };
  } else {
    const seen = new Set(state.bank.map((q) => q.id + "|" + q.stem.slice(0, 40)));
    const add = newQs.filter((q) => !seen.has(q.id + "|" + q.stem.slice(0, 40)));
    state.bank = state.bank.concat(add);
    state.meta.loadedAt = Date.now();
    state.meta.sources = Array.from(new Set((state.meta.sources || []).concat(sourceName)));
    saveBank();
    return add.length;
  }
  saveBank();
  return newQs.length;
}

function loadSample(which, mode = "append") {
  const map = { im: [SAMPLE_IM, "內科綜合示範卷"], img: [SAMPLE_IMG, "影像判讀示範"] };
  const [data, name] = map[which] || [];
  if (!data) return;
  const { questions, errors } = parseBankJSON(JSON.stringify(data));
  const n = addQuestions(questions, name, mode);
  if (errors.length) console.warn(errors);
  toast(`已載入「${name}」${n} 題`, "ok");
  render();
}

function handleFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  let done = 0, added = 0, allErrors = [];
  let first = true; /* 「取代」模式只對第一個成功讀取的檔案生效，其餘檔案改為附加 */
  list.forEach((file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const { questions, errors } = parseBankJSON(String(reader.result));
        const mode = (importMode === "replace" && first) ? "replace" : "append";
        first = false;
        added += addQuestions(questions, file.name, mode);
        allErrors = allErrors.concat(errors.map((e) => `${file.name} ${e}`));
      } catch (e) {
        allErrors.push(`${file.name}：${e.message}`);
      }
      done++;
      if (done === list.length) finishImport(added, allErrors);
    };
    reader.onerror = () => { done++; allErrors.push(`${file.name}：讀取失敗`); if (done === list.length) finishImport(added, allErrors); };
    reader.readAsText(file, "utf-8");
  });
}

function finishImport(added, errors) {
  render();
  if (added) toast(`成功匯入 ${added} 題`, "ok", 3200);
  if (errors.length) {
    openModal(`<h3>⚠️ 有 ${errors.length} 筆資料被略過</h3>
      <p class="small muted" style="margin:.4rem 0 .7rem">其餘題目已成功匯入。以下為被略過的原因：</p>
      <div class="textarea" style="max-height:240px; overflow:auto; white-space:pre-wrap">${esc(errors.slice(0, 50).join("\n"))}${errors.length > 50 ? "\n…" : ""}</div>
      <div class="btn-row" style="justify-content:flex-end; margin-top:.9rem"><button class="btn btn-primary" data-act="close-modal">知道了</button></div>`);
  } else if (!added) toast("沒有新增任何題目（可能全部重複）", "err");
}

/* ------------------------- 16. 事件系統 ------------------------- */
function selectedCatsToggle(arr, cat) {
  if (cat === "__all") return [];
  const i = arr.indexOf(cat);
  if (i >= 0) arr.splice(i, 1); else arr.push(cat);
  return arr;
}

document.addEventListener("click", async (e) => {
  /* --- 篩選 pill --- */
  const pill = e.target.closest(".pill");
  if (pill) {
    const p = pill.parentElement;
    if (pill.dataset.cat !== undefined) {
      const target = state.view === "practiceSetup" ? setupState.practice : setupState.exam;
      target.cats = selectedCatsToggle(target.cats.slice(), pill.dataset.cat);
      return render();
    }
    if (pill.dataset.count !== undefined) { setupState.practice.count = +pill.dataset.count; return render(); }
    if (pill.dataset.limit !== undefined) { setupState.exam.limitMin = +pill.dataset.limit; return render(); }
    if (pill.dataset.wcat !== undefined) { wrongSetup.cats = selectedCatsToggle(wrongSetup.cats.slice(), pill.dataset.wcat); return render(); }
    if (pill.dataset.wcount !== undefined) { wrongSetup.count = +pill.dataset.wcount; return render(); }
    if (pill.dataset.mode !== undefined) {
      importMode = pill.dataset.mode;
      $$("#importMode .pill").forEach((b) => b.classList.toggle("on", b.dataset.mode === importMode));
      return;
    }
  }

  /* --- 錯題移出門檻設定（使用說明對話框內） --- */
  const mst = e.target.closest("[data-mastery]");
  if (mst) {
    state.settings.masteryStreak = +mst.dataset.mastery;
    saveSettings();
    $$("[data-mastery]").forEach((x) => x.classList.toggle("on", +x.dataset.mastery === state.settings.masteryStreak));
    toast("已設定：連對 " + state.settings.masteryStreak + " 次移出錯題本", "ok");
    return;
  }

  /* --- 手風琴 --- */
  const acc = e.target.closest("[data-acc]");
  if (acc) {
    const panel = $("#acc-" + acc.dataset.acc);
    const open = acc.getAttribute("aria-expanded") === "true";
    acc.setAttribute("aria-expanded", String(!open));
    if (panel) panel.classList.toggle("open", !open);
    const lbl = acc.querySelector("span");
    if (lbl && lbl.textContent.includes("詳解")) lbl.textContent = `📖 ${!open ? "收合" : "展開"}完整詳解（核心解析 + 選項逐項解析與修正）`;
    return;
  }

  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;

  switch (act) {
    case "nav": go(btn.dataset.view); break;
    case "close-modal": closeModal(); break;

    /* 題庫 */
    case "load-samples":
      loadSample("im", state.bank.length ? "append" : "replace");
      loadSample("img", "append");
      break;
    case "load-sample": loadSample(btn.dataset.which, importMode); break;
    case "export-bank": downloadJSON(`im-question-bank-${state.bank.length}q.json`, state.bank.map(toRawSchema)); break;
    case "clear-bank":
      if (await confirmDialog("清空題庫？", "將移除瀏覽器中保存的全部題目（錯題本與學習紀錄不受影響）。此動作無法復原。", "清空題庫")) {
        state.bank = []; state.meta = { name: "", loadedAt: null, sources: [] }; saveBank(); render(); toast("題庫已清空");
      }
      break;
    case "import-paste": {
      const txt = $("#pasteArea")?.value.trim();
      if (!txt) return toast("請先貼上 JSON 內容", "err");
      try {
        const { questions, errors } = parseBankJSON(txt);
        const n = addQuestions(questions, "貼上匯入", importMode);
        finishImport(n, errors);
      } catch (err) { toast(err.message, "err", 4200); }
      break;
    }
    case "download-template": downloadJSON("question-template.json", TEMPLATE); break;
    case "copy-template":
      try { await navigator.clipboard.writeText(JSON.stringify(TEMPLATE, null, 2)); toast("範本已複製到剪貼簿", "ok"); }
      catch (err) { const t = $("#pasteArea"); if (t) { t.value = JSON.stringify(TEMPLATE, null, 2); toast("已填入下方輸入框", "ok"); } }
      break;

    /* 設定 */
    case "exam-order": setupState.exam.shuffle = btn.dataset.v === "1"; render(); break;
    case "opt-order": state.settings.shuffleOptions = btn.dataset.v === "1"; saveSettings(); render(); break;

    /* 開始測驗 */
    case "start-exam": {
      const s = setupState.exam;
      const pool = s.cats.length ? state.bank.filter((q) => s.cats.includes(q.category)) : state.bank;
      startQuiz({
        mode: "exam", navKey: "examSetup",
        title: `完整測驗 · ${pool.length} 題${s.cats.length ? " · " + s.cats.join("／") : ""}`,
        questions: pool, shuffleQ: s.shuffle, limitMin: s.limitMin,
      });
      break;
    }
    case "start-practice": {
      const s = setupState.practice;
      const pool = s.cats.length ? state.bank.filter((q) => s.cats.includes(q.category)) : state.bank;
      const n = Math.min(s.count, pool.length);
      startQuiz({
        mode: "practice", navKey: "practiceSetup",
        title: `零碎練習 · ${n} 題${s.cats.length ? " · " + s.cats.join("／") : ""}`,
        questions: shuffle(pool).slice(0, n), shuffleQ: false,
      });
      break;
    }
    case "start-wrong": {
      const pool = (wrongSetup.cats.length ? state.wrong.filter((w) => wrongSetup.cats.includes(w.q.category)) : state.wrong);
      const n = Math.min(wrongSetup.count, pool.length);
      startQuiz({
        mode: "wrong", navKey: "wrong",
        title: `錯題重測 · ${n} 題`,
        questions: shuffle(pool).slice(0, n).map((w) => w.q), shuffleQ: false,
      });
      break;
    }

    /* 錯題本 */
    case "drop-wrong": state.wrong.splice(+btn.dataset.i, 1); saveWrong(); render(); toast("已從錯題本移除"); break;
    case "clear-wrong":
      if (await confirmDialog("清空錯題本？", `將移除全部 ${state.wrong.length} 題錯題紀錄，此動作無法復原。`, "清空")) {
        state.wrong = []; saveWrong(); render(); toast("錯題本已清空");
      }
      break;
    case "export-wrong": downloadJSON(`im-wrong-questions-${state.wrong.length}q.json`, state.wrong.map((w) => toRawSchema(w.q))); break;
    case "clear-history":
      if (await confirmDialog("清除學習紀錄？", "將移除全部測驗歷程與分科統計，錯題本不受影響。", "清除")) {
        state.history = []; saveHistory(); render(); toast("紀錄已清除");
      }
      break;
    case "goto-wrong": go("wrong"); break;

    /* 續作 */
    case "resume-go": resumeQuiz(); break;
    case "resume-drop": LS.del(K.resume); render(); toast("已捨棄未完成的測驗"); break;

    /* 測驗中 */
    case "pick": pickOption(btn.dataset.key); break;
    case "prev": gotoQ(state.quiz.idx - 1); break;
    case "next": gotoQ(state.quiz.idx + 1); break;
    case "jump": gotoQ(+btn.dataset.i); break;
    case "flag":
      state.quiz.flags[state.quiz.idx] = !state.quiz.flags[state.quiz.idx];
      renderQuizBody(); persistResume();
      break;
    case "opensheet": openSheet(`<div style="font-weight:800; margin-bottom:.6rem">題號導覽</div>` + qnavHTML(true)); break;
    case "submit": {
      const z = state.quiz;
      if (!z) break;
      const un = z.qs.length - Object.keys(z.answers).length;
      if (un > 0) {
        const okGo = await confirmDialog("確定要交卷？", `尚有 <b>${un}</b> 題未作答，未作答的題目會計為零分。交卷後將顯示分數與完整詳解。`, "確定交卷", false);
        if (!okGo) break;
      }
      closeSheet();
      submitQuiz();
      break;
    }
    case "abort":
      if (await confirmDialog("離開測驗？", "目前作答進度會自動保存，可從首頁繼續作答。", "離開", false)) {
        persistResume(); stopTimer(); state.quiz = null; go("home");
      }
      break;

    /* 結果頁 */
    case "rfilter": state.reviewFilter = btn.dataset.f; render(); break;
    case "expand-all":
      $$("#reviewList .acc-panel").forEach((p) => p.classList.add("open"));
      $$("#reviewList .acc-btn").forEach((b) => b.setAttribute("aria-expanded", "true"));
      break;
    case "collapse-all":
      $$("#reviewList .acc-panel").forEach((p) => p.classList.remove("open"));
      $$("#reviewList .acc-btn").forEach((b) => b.setAttribute("aria-expanded", "false"));
      break;
    case "retry-same": {
      const r = state.result;
      startQuiz({ mode: r.mode, navKey: r.navKey, title: r.title.replace(/（複習）$/, "") + "（複習）", questions: r.qs, shuffleQ: true });
      break;
    }
    case "export-result": {
      const r = state.result;
      downloadJSON(`im-result-${new Date(r.ts).toISOString().slice(0, 10)}.json`, {
        title: r.title, date: new Date(r.ts).toISOString(), score: `${r.correct}/${r.total}`, percent: r.pct,
        duration: fmtTime(r.durationMs), byCategory: r.byCat,
        details: r.qs.map((q, i) => ({
          id: q.id, category: q.category, stem: q.stem,
          your_answer: (r.answers[i] || []).join(",") || null,
          correct_answer: q.answers.join(","),
          result: !(r.answers[i] || []).length ? "unanswered" : isCorrect(q, r.answers[i]) ? "correct" : "wrong",
        })),
      });
      break;
    }
    case "print": window.print(); break;

    /* 影像 */
    case "zoom": openLightbox(btn.dataset.src, btn.dataset.cap); break;
  }
});

/* 檔案與滑桿 */
document.addEventListener("change", (e) => {
  if (e.target.id === "fileInput") handleFiles(e.target.files);
});
document.addEventListener("input", (e) => {
  if (e.target.id === "countSlider") {
    const s = setupState.practice;
    s.count = +e.target.value;
    $$("#countPills .pill").forEach((b) => b.classList.toggle("on", +b.dataset.count === s.count));
    const pool = s.cats.length ? state.bank.filter((q) => s.cats.includes(q.category)) : state.bank;
    const target = $("#practiceCountVal");
    if (target) target.textContent = Math.min(s.count, pool.length) + " 題";
  }
});

/* 鍵盤操作 */
document.addEventListener("keydown", (e) => {
  if ($("#lightbox").classList.contains("open")) {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "+" || e.key === "=") lbZoomAt(LB.scale * 1.4);
    if (e.key === "-") lbZoomAt(LB.scale / 1.4);
    if (e.key === "0") lbReset();
    return;
  }
  if (e.key === "Escape") { closeModal(); closeSheet(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
  if (state.view !== "quiz" || !state.quiz || state.quiz.submitted) return;

  const z = state.quiz;
  const q = z.qs[z.idx];
  const k = e.key.toUpperCase();
  if (/^[A-J]$/.test(k) && q.options.some((o) => o.key === k)) { e.preventDefault(); pickOption(k); return; }
  if (/^[1-9]$/.test(k)) { const o = q.options[+k - 1]; if (o) { e.preventDefault(); pickOption(o.key); } return; }
  if (e.key === "ArrowLeft") { e.preventDefault(); gotoQ(z.idx - 1); }
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); gotoQ(z.idx + 1); }
  if (k === "F") { e.preventDefault(); z.flags[z.idx] = !z.flags[z.idx]; renderQuizBody(); }
});

/* 頂部工具列 */
function initTopbar() {
  $("#btnTheme").addEventListener("click", () => {
    const order = ["auto", "light", "dark"];
    state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3];
    saveSettings(); applyTheme();
    toast("顯示模式：" + { auto: "跟隨系統", light: "淺色", dark: "深色" }[state.settings.theme]);
  });
  $("#btnFont").addEventListener("click", () => {
    const steps = [1, 1.1, 1.22];
    state.settings.fontScale = steps[(steps.indexOf(state.settings.fontScale) + 1) % steps.length];
    saveSettings(); applyFont();
    toast("字級：" + Math.round(state.settings.fontScale * 100) + "%");
  });
  $("#btnHelp").addEventListener("click", showHelp);
  $("#navtabs").addEventListener("click", (e) => {
    const t = e.target.closest(".navtab");
    if (t) go(t.dataset.nav);
  });
  $("#modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });
  $("#sheetBackdrop").addEventListener("click", (e) => { if (e.target.id === "sheetBackdrop") closeSheet(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (state.settings.theme === "auto") applyTheme(); });
  window.addEventListener("beforeunload", persistResume);
}

function showHelp() {
  openModal(`<h3>📖 使用說明</h3>
    <div class="small" style="line-height:1.9; max-height:60vh; overflow:auto; margin:.6rem 0">
      <p><b>A · 完整測驗</b>：整份考卷一次作答，交卷後顯示分數與逐題詳解，可設定作答時限。</p>
      <p><b>B · 零碎練習</b>：自選 5–100 題與次專科，適合值班空檔快速練習。</p>
      <p><b>C · 錯題重測</b>：A、B 模式答錯的題目自動收錄；重測答對 ${state.settings.masteryStreak} 次後自動移出。</p>
      <hr class="divider" />
      <p><b>影像操作</b>：點擊題目圖片可開啟全螢幕燈箱，支援雙指縮放、拖曳平移、滾輪縮放、雙擊放大。</p>
      <p><b>鍵盤快速鍵</b>：<kbd>A</kbd>–<kbd>E</kbd> 或 <kbd>1</kbd>–<kbd>5</kbd> 選答、<kbd>←</kbd><kbd>→</kbd> 換題、<kbd>F</kbd> 標記、<kbd>Enter</kbd> 下一題、<kbd>Esc</kbd> 關閉視窗。</p>
      <p><b>資料保存</b>：題庫、錯題本與學習紀錄都存在此瀏覽器的 localStorage，不會上傳到任何伺服器；換裝置或清除瀏覽資料會遺失，重要題庫請用「匯出 JSON」備份。</p>
      <hr class="divider" />
      <p><b>錯題移出門檻</b>：答對幾次後把題目移出錯題本？</p>
      <div class="pill-group" style="margin-top:.4rem">
        ${[1, 2, 3].map((n) => `<button class="pill ${state.settings.masteryStreak === n ? "on" : ""}" data-mastery="${n}">連對 ${n} 次</button>`).join("")}
      </div>
    </div>
    <div class="btn-row" style="justify-content:flex-end"><button class="btn btn-primary" data-act="close-modal">關閉</button></div>`);
}

/* ------------------------- 17. 啟動 ------------------------- */
function boot() {
  loadPersisted();
  applyTheme();
  applyFont();
  initTopbar();
  initLightbox();
  render();
  if (!state.bank.length && !LS.get(K.bank, null)) {
    /* 首次使用：預先載入內建範例，讓使用者可以立刻試玩 */
    loadSample("im", "replace");
    loadSample("img", "append");
    state.view = "home";
    render();
  }
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
